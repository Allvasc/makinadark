services:
  postgres:
    image: postgres:16-alpine
    container_name: makinadark-db
    restart: always
    environment:
      POSTGRES_USER: makina
      POSTGRES_PASSWORD: makinadark
      POSTGRES_DB: makinadark
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  image-ranker:
    build:
      context: ./image-ranker
      dockerfile: Dockerfile
    container_name: makinadark-image-ranker
    restart: always
    # No published host port - only the backend talks to this, over the
    # internal compose network (http://image-ranker:8500).
    expose:
      - "8500"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: makinadark-backend
    restart: always
    ports:
      - "8081:8080"
    # Secrets are NOT baked into this file or the image - they're substituted
    # from the environment docker-compose itself runs in. Locally, run:
    #   docker compose --env-file backend/.env up -d --build
    # (backend/.env already has every key below, gitignored, never committed).
    # On EasyPanel, paste the same key=value pairs into the Compose service's
    # "Environment" tab - EasyPanel writes them to its own .env next to this
    # file before running compose, so the exact same substitution applies.
    environment:
      - PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=makina
      - POSTGRES_PASSWORD=makinadark
      - POSTGRES_DB=makinadark
      - IMAGE_RANKER_URL=http://image-ranker:8500
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - POLLINATIONS_API_KEY=${POLLINATIONS_API_KEY}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - SHOTSTACK_API_KEY=${SHOTSTACK_API_KEY}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
      - TIKTOK_CLIENT_ID=${TIKTOK_CLIENT_ID}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - USER_PHONE_NUMBER=${USER_PHONE_NUMBER}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
    volumes:
      - backend_media:/app/media
    depends_on:
      - postgres
      - image-ranker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: makinadark-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
